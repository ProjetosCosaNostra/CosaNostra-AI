name: BlackGold Control Plane Validate

on:
  push:
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-validate.yml'
      - '.github/workflows/control-plane-promote-stable.yml'
  pull_request:
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-validate.yml'
      - '.github/workflows/control-plane-promote-stable.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files and PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'control-plane/BLACKGOLD_CONTROL_PLANE.md',
            'control-plane/AGENT_ENTRYPOINT.md',
            'control-plane/CURRENT_TRUTH.json',
            'control-plane/PROJECT_REGISTRY.json',
            'control-plane/security/PUBLIC_PRIVATE_DATA_BOUNDARY.md',
            'control-plane/LATEST.json',
            'control-plane/manifest.json',
            'control-plane/project-pointer.json',
            'control-plane/policies/windows.json',
            'control-plane/templates/AGENTS.md',
            'control-plane/templates/control-plane.json',
            'control-plane/install.ps1',
            'control-plane/bootstrap.ps1',
            'control-plane/Update-BlackGoldControl.ps1',
            'control-plane/Register-BlackGoldProjects.ps1',
            'control-plane/Status-BlackGoldControl.ps1',
            'control-plane/Repair-BlackGoldControl.ps1',
            'control-plane/Doctor-BlackGoldControl.ps1',
            'control-plane/agent/BlackGold.Control.ps1',
            'control-plane/agent/Register-BlackGoldControl.ps1',
            'control-plane/agent/Uninstall-BlackGoldControl.ps1'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required file missing: $path"
            }
          }

          $manifest = Get-Content 'control-plane/manifest.json' -Raw | ConvertFrom-Json
          $latest = Get-Content 'control-plane/LATEST.json' -Raw | ConvertFrom-Json
          $truth = Get-Content 'control-plane/CURRENT_TRUTH.json' -Raw | ConvertFrom-Json
          $registry = Get-Content 'control-plane/PROJECT_REGISTRY.json' -Raw | ConvertFrom-Json
          Get-Content 'control-plane/project-pointer.json' -Raw | ConvertFrom-Json | Out-Null
          Get-Content 'control-plane/policies/windows.json' -Raw | ConvertFrom-Json | Out-Null
          Get-Content 'control-plane/templates/control-plane.json' -Raw | ConvertFrom-Json | Out-Null

          if ([string]$manifest.version -ne [string]$latest.version) {
            throw "Version mismatch: manifest=$($manifest.version) latest=$($latest.version)"
          }
          if ([string]$manifest.version -ne [string]$truth.version) {
            throw "Version mismatch: manifest=$($manifest.version) current_truth=$($truth.version)"
          }
          if ($truth.state -ne 'ACTIVE') {
            throw "CURRENT_TRUTH state must be ACTIVE"
          }
          if ($registry.repositories.Count -lt 1) {
            throw "PROJECT_REGISTRY must contain at least one public repository"
          }
          if ($registry.private_repository_names_omitted -ne $true) {
            throw 'Public PROJECT_REGISTRY must omit private repository names'
          }
          if ($registry.registry_scope -ne 'public_discovery_only') {
            throw 'Public PROJECT_REGISTRY registry_scope must remain public_discovery_only'
          }
          if ([string]$registry.control_plane_version -ne [string]$manifest.version) {
            throw "Registry version mismatch: registry=$($registry.control_plane_version) manifest=$($manifest.version)"
          }

          $scripts = Get-ChildItem 'control-plane' -Recurse -Filter '*.ps1' -File
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($script.FullName + ': ' + $_.Message) }
              throw "PowerShell syntax validation failed: $($script.FullName)"
            }
          }

          if ($manifest.cmd_policy -ne 'hide_visible_cmd') {
            throw 'cmd_policy must remain hide_visible_cmd'
          }
          if ($manifest.automatic_update -ne $true) {
            throw 'automatic_update must remain true'
          }
          if ($manifest.project_registry_enabled -ne $true) {
            throw 'project_registry_enabled must remain true'
          }
          if ($manifest.self_heal_doctor -ne $true) {
            throw 'self_heal_doctor must remain true'
          }
          if ($manifest.runtime_reads_stable_branch_only -ne $true) {
            throw 'runtime_reads_stable_branch_only must remain true'
          }
          if ($manifest.stable_branch -ne 'control-plane-stable') {
            throw 'stable_branch must remain control-plane-stable'
          }

          $runtimeFiles = @(
            'control-plane/install.ps1',
            'control-plane/bootstrap.ps1',
            'control-plane/Update-BlackGoldControl.ps1',
            'control-plane/Repair-BlackGoldControl.ps1',
            'control-plane/Doctor-BlackGoldControl.ps1',
            'control-plane/Status-BlackGoldControl.ps1'
          )

          foreach ($runtimeFile in $runtimeFiles) {
            $runtimeText = Get-Content $runtimeFile -Raw
            if ($runtimeText -match 'ProjetosCosaNostra/CosaNostra-AI/main/control-plane') {
              throw "Runtime file reads main instead of stable: $runtimeFile"
            }
          }
          if ($manifest.secrets_allowed -ne $false) {
            throw 'secrets_allowed must remain false'
          }

          Write-Host "BLACKGOLD_CONTROL_PLANE_VALIDATION_PASS version=$($manifest.version) repos=$($registry.repositories.Count)"
